<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Bloom</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f0ec;
      font-family: "SF Pro Text", "PingFang SC", sans-serif;
    }
    canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      cursor: none;
    }
    /* 必须有真实分辨率才能出帧 */
    #cam {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 20;
      width: 200px;
      height: 150px;
      object-fit: cover;
      background: #111;
      border: 1px solid rgba(0, 0, 0, 0.35);
      transform: scaleX(-1);
      pointer-events: none;
    }
    #debug {
      position: fixed;
      left: 12px;
      top: 170px;
      z-index: 20;
      max-width: 280px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.88);
      color: #222;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
      user-select: none;
    }
    body.hide-debug #cam,
    body.hide-debug #debug {
      display: none !important;
    }
    #hud { display: none !important; }
    #cam-label { display: none !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
</head>
<body>
  <video id="cam" playsinline muted autoplay></video>
  <div id="debug">正在打开摄像头…</div>
  <div id="cam-label"></div>
  <div id="hud">加载中…</div>
  <script type="module" src="./sketch.js?v=13"></script>
</body>
</html>
